<!DOCTYPE html>
<html lang="en" id="top">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.webp" />
    <script>
      (function() {
        const theme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <style>
      :root {
        --bg-color: #f7f5f0;
        --surface-color: #fdfbf7;
        --text-color: #262420;
        --text-muted: #827c6e;
        --accent: #a96535;
        --accent-hover: #8f5527;
        --accent-ink: #ffffff;
        --border-color: #e5e0d3;
        --header-text: #262420;
        --footer-text: #827c6e;
        --fog-top: rgba(247, 245, 240, 0.52);
        --fog-mid: rgba(247, 245, 240, 0.34);
        --fog-bottom: rgba(247, 245, 240, 0.14);
        --fog-blur: 6px;
        --font-serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif;
        --font-sans: 'Helvetica Neue', Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace;
      }
      html[data-theme="dark"] {
        --bg-color: #181713;
        --surface-color: #201e19;
        --text-color: #e3dfd4;
        --text-muted: #948d7d;
        --accent: #cf9459;
        --accent-hover: #e0ab74;
        --accent-ink: #181713;
        --border-color: #2e2c25;
        --header-text: #e3dfd4;
        --footer-text: #948d7d;
        --fog-top: rgba(24, 23, 19, 0.28);
        --fog-mid: rgba(24, 23, 19, 0.15);
        --fog-bottom: rgba(24, 23, 19, 0.04);
        --fog-blur: 3px;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: var(--font-sans);
        font-size: 15px;
        background-color: var(--bg-color);
        color: var(--text-color);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      ::selection {
        background-color: var(--accent);
        color: var(--accent-ink);
      }
    </style>
    %sveltekit.head%
  </head>
  <body>
    <div id="svelte">%sveltekit.body%</div>
  </body>
</html>
